name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            DIR="/home/websites/joyce-prod"
            cd "$DIR"
            git fetch origin
            git checkout main
            git pull origin main

            docker compose -f docker-compose.yml up -d --build

            echo "Waiting for container to be healthy..."
            sleep 10
            CONTAINER="chayce-web-prod"
            for i in $(seq 1 12); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                echo "Container is healthy!"
                exit 0
              fi
              echo "Attempt $i/12: Status is $STATUS, waiting..."
              sleep 10
            done
            echo "Container did not become healthy within 2 minutes"
            docker logs "$CONTAINER" --tail 50
            exit 1

      - name: Verify Health
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ vars.PROD_DOMAIN }}")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Production health check passed (HTTP $HTTP_CODE)"
          else
            echo "Production health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi
