services:
  chayce-web-prod:
    container_name: chayce-web-prod
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - hosting
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hosting"
      - "traefik.http.routers.chayce-web-prod.rule=Host(`chayceproperties.com`)"
      - "traefik.http.routers.chayce-web-prod.entrypoints=websecure"
      - "traefik.http.routers.chayce-web-prod.tls=true"
      - "traefik.http.routers.chayce-web-prod.tls.certresolver=letsencrypt"
      - "traefik.http.routers.chayce-web-prod-http.rule=Host(`chayceproperties.com`)"
      - "traefik.http.routers.chayce-web-prod-http.entrypoints=web"
      - "traefik.http.routers.chayce-web-prod-http.middlewares=chayce-web-prod-redirect"
      - "traefik.http.middlewares.chayce-web-prod-redirect.redirectscheme.scheme=https"
      - "traefik.http.services.chayce-web-prod.loadbalancer.server.port=80"

networks:
  hosting:
    external: true
